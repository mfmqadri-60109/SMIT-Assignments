<body>
  <div class="container">
    <h2> Sign in </h2>
    <p class="tag"> <b>login with your email account</b> </p>

    <form action="">
      <label for="Email"> Email </label>
      <input type="email" id="box" maxlength="35">

      <label for="Passward"> Password </label>

      <p id="checkbox"><input type="checkbox">&nbsp;&nbsp;&nbsp; keep me logged in?</p>

      <button> Sign in</button>
    </form>
    <p class="endtag"><a id="a1" href="">Forgot password?</a>&nbsp;&nbsp;&nbsp;&nbsp;<a id="a2" href="">Not registered?
        Sign up</a></p>


  </div>
</body>

</html>
